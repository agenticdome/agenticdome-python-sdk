[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticdome-python-sdk"
version = "1.2.12"
description = "Official Python SDK for AgenticDome security guardrails, DLP, tool authorization, and multi-agent delegation enforcement."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

authors = [
    { name = "AgenticDome" }
]

keywords = [
    "agentguard",
    "agenticdome",
    "ai-security",
    "agent-security",
    "guardrails",
    "a2a",
    "mcp",
    "zero-trust",
    "runtime-security"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0"
]

[project.optional-dependencies]
crewai = [
    "crewai>=1.15.5,<=1.15.14"
]
redis = [
    "redis>=4.5.0"
]
pop = [
    "cryptography>=42.0.0"
]
pydanticai = [
    "pydantic-ai>=2.16.0,<=2.27.1",
    "anyio>=4.0.0"
]
pydantic = [
    "pydantic-ai>=2.16.0,<=2.27.1",
    "anyio>=4.0.0"
]
langgraph = [
    "langgraph>=1.2.9,<=1.2.10",
    "langchain-core>=1.5.0,<=1.5.3",
    "langchain-openai==1.3.5",
    "anyio>=4.0.0"
]
microsoft = []
autogen = [
    "autogen-agentchat==0.7.5"
]
microsoft-autogen = [
    "autogen-agentchat==0.7.5"
]
foundry = [
    "azure-ai-projects>=2.3.0,<=2.4.0",
    "azure-identity==1.25.3"
]
agno = [
    "agno>=2.8.0,<=2.8.7"
]
openai-agents = [
    "openai-agents>=0.18.3,<=0.20.0"
]
mcp = [
    "mcp>=1.26.0,<=1.28.1"
]
bedrock = [
    "boto3>=1.43.54,<=1.43.68"
]
aws-bedrock = [
    "boto3>=1.43.54,<=1.43.68"
]
llamaindex = [
    "llama-index==0.14.23"
]
llama-index = [
    "llama-index==0.14.23"
]
google-adk = [
    "google-adk>=2.5.0,<=2.6.3"
]
adk = [
    "google-adk>=2.5.0,<=2.6.3"
]
claude = [
    "claude-agent-sdk>=0.2.126,<=0.2.135"
]
claude-agent-sdk = [
    "claude-agent-sdk>=0.2.126,<=0.2.135"
]
smolagents = [
    "smolagents==1.26.0"
]
all = [
    "crewai>=1.15.5,<=1.15.14",
    "redis>=4.5.0",
    "cryptography>=42.0.0",
    "pydantic-ai>=2.16.0,<=2.27.1",
    "anyio>=4.0.0",
    "langgraph>=1.2.9,<=1.2.10",
    "langchain-core>=1.5.0,<=1.5.3",
    "langchain-openai==1.3.5",
    "autogen-agentchat==0.7.5",
    "agno>=2.8.0,<=2.8.7",
    "azure-ai-projects>=2.3.0,<=2.4.0",
    "azure-identity==1.25.3",
    "openai-agents>=0.18.3,<=0.20.0",
    "mcp>=1.26.0,<=1.28.1",
    "boto3>=1.43.54,<=1.43.68",
    "llama-index==0.14.23",
    "google-adk>=2.5.0,<=2.6.3",
    "claude-agent-sdk>=0.2.126,<=0.2.135",
    "smolagents==1.26.0"
]
dev = [
    "pytest>=8.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]


[project.urls]
Homepage = "https://www.agenticdome.io"
Repository = "https://github.com/agenticdome/agenticdome-python-sdk"
Documentation = "https://github.com/agenticdome/agenticdome-python-sdk#readme"
"MCP Integration Guide" = "https://github.com/agenticdome/agenticdome-python-sdk/blob/main/docs/mcp-integration.md"
Issues = "https://github.com/agenticdome/agenticdome-python-sdk/issues"
Examples = "https://github.com/agenticdome/agenticdome-python-sdk/tree/main/examples"
Security = "https://github.com/agenticdome/agenticdome-python-sdk/security/policy"

[project.scripts]
agenticdome-demo = "agenticdome_sdk.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agenticdome_sdk*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
strict = false

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticdome-python-sdk"
version = "1.1.1"
description = "Official Python SDK for AgentGuard Intelligence Engine and Action Firewall."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }

authors = [
    { name = "AgenticDome" }
]

keywords = [
    "agentguard",
    "agenticdome",
    "ai-security",
    "agent-security",
    "guardrails",
    "a2a",
    "mcp",
    "zero-trust",
    "runtime-security"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0"
]

[project.optional-dependencies]
crewai = [
    "crewai"
]
redis = [
    "redis>=4.5.0"
]
pydanticai = [
    "pydantic-ai",
    "anyio>=4.0.0"
]
pydantic = [
    "pydantic-ai",
    "anyio>=4.0.0"
]
langgraph = [
    "langgraph",
    "langchain-core",
    "anyio>=4.0.0"
]
microsoft = []
foundry = [
    "azure-ai-projects",
    "azure-identity"
]
agno = [
    "agno"
]
openai-agents = [
    "openai-agents"
]
mcp = [
    "mcp"
]
bedrock = [
    "boto3"
]
aws-bedrock = [
    "boto3"
]
llamaindex = [
    "llama-index"
]
llama-index = [
    "llama-index"
]
google-adk = [
    "google-adk"
]
adk = [
    "google-adk"
]
all = [
    "crewai",
    "redis>=4.5.0",
    "pydantic-ai",
    "anyio>=4.0.0",
    "langgraph",
    "langchain-core",
    "agno",
    "azure-ai-projects",
    "azure-identity",
    "openai-agents",
    "mcp",
    "boto3",
    "llama-index",
    "google-adk"
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]


[project.urls]
Homepage = "https://au.agenticdome.io"
Repository = "https://github.com/agenticdome/agenticdome-python-sdk"
Documentation = "https://github.com/agenticdome/agenticdome-python-sdk#readme"
Issues = "https://github.com/agenticdome/agenticdome-python-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agenticdome_sdk*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
strict = false

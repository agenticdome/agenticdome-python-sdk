[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticdome-python-sdk"
version = "1.1.3"
description = "Official Python SDK for AgenticDome security guardrails, DLP, tool authorization, and multi-agent delegation enforcement."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }

authors = [
    { name = "AgenticDome" }
]

keywords = [
    "agentguard",
    "agenticdome",
    "ai-security",
    "agent-security",
    "guardrails",
    "a2a",
    "mcp",
    "zero-trust",
    "runtime-security"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0"
]

[project.optional-dependencies]
crewai = [
    "crewai>=1.15.2"
]
redis = [
    "redis>=4.5.0"
]
pydanticai = [
    "pydantic-ai>=2.10.0",
    "anyio>=4.0.0"
]
pydantic = [
    "pydantic-ai>=2.10.0",
    "anyio>=4.0.0"
]
langgraph = [
    "langgraph>=1.2.9",
    "langchain-core>=1.4.9",
    "anyio>=4.0.0"
]
microsoft = []
foundry = [
    "azure-ai-projects>=2.3.0",
    "azure-identity>=1.25.3"
]
agno = [
    "agno>=2.7.3"
]
openai-agents = [
    "openai-agents>=0.18.2"
]
mcp = [
    "mcp>=1.26.0"
]
bedrock = [
    "boto3>=1.43.48"
]
aws-bedrock = [
    "boto3>=1.43.48"
]
llamaindex = [
    "llama-index>=0.14.23"
]
llama-index = [
    "llama-index>=0.14.23"
]
google-adk = [
    "google-adk>=2.4.0"
]
adk = [
    "google-adk>=2.4.0"
]
all = [
    "crewai>=1.15.2",
    "redis>=4.5.0",
    "pydantic-ai>=2.10.0",
    "anyio>=4.0.0",
    "langgraph>=1.2.9",
    "langchain-core>=1.4.9",
    "agno>=2.7.3",
    "azure-ai-projects>=2.3.0",
    "azure-identity>=1.25.3",
    "openai-agents>=0.18.2",
    "mcp>=1.26.0",
    "boto3>=1.43.48",
    "llama-index>=0.14.23",
    "google-adk>=2.4.0"
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]


[project.urls]
Homepage = "https://au.agenticdome.io"
Repository = "https://github.com/agenticdome/agenticdome-python-sdk"
Documentation = "https://github.com/agenticdome/agenticdome-python-sdk#readme"
Issues = "https://github.com/agenticdome/agenticdome-python-sdk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agenticdome_sdk*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
strict = false
